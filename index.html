<script>
const steps=[{"tag":"A very official birthday investigation","title":"Well, well, <em>Preet.</em>","intro":"You have been summoned. Nothing alarming. Just a small matter involving a birthday, an unreasonable amount of effort, and someone who clearly doesn't know how to send a normal text.","question":"How would you like to respond to these allegations?","options":[["I demand an explanation.","Understandable. The suspect claims he was 'just making a little something.' The evidence suggests otherwise."],["I plead extremely cute.","The court agrees. Case dismissed. Unfortunately, the birthday nonsense must continue."]],"after":"Welcome, birthday girl. This is your tiny, slightly unhinged corner of the universe. Take your time. Every page is yours."},{"tag":"The annual celebration of you","title":"Another year of <em>you.</em>","intro":"Somewhere a calendar turned a page and the universe went, 'Oh. This one's important.' It didn't say why. I think it was trying to be mysterious.","question":"How should your grand entrance be announced?","options":[["With trumpets, obviously.","BAAAAAA. That was a trumpet. Please respect the production budget."],["Quietly. I'm mysterious.","Of course. A very mysterious person who has just pressed a button on a pink website."]],"after":"May this year surprise you in the nicest ways. May the difficult things grow lighter, the lovely things stay longer, and the ordinary Tuesdays turn out better than expected."},{"tag":"An emergency notice","title":"A serious <em>complaint.</em>","intro":"I have filed a formal complaint against the miles between us. They are being terribly unreasonable, refusing to fold themselves neatly into a paper airplane.","question":"What punishment does geography deserve?","options":[["Immediate dismissal.","Agreed. Geography has been fired. It says it has a family to feed. I remain unmoved."],["A strongly worded letter.","Dear Geography, your behaviour is embarrassing. Kindly become smaller. Regards, Everyone."]],"after":"Until distance learns some manners, there are still messages, ridiculous conversations, and the strange comfort of knowing someone is out there thinking of you."},{"tag":"The department of missing hoodies","title":"A very suspicious <em>disappearance.</em>","intro":"Imagine opening your wardrobe and discovering that your favourite hoodie has mysteriously developed a new owner. The new owner is looking extremely innocent.","question":"Preet, what is your official statement?","options":[["It looks better on me.","A compelling legal argument. The hoodie has requested permanent relocation."],["What hoodie? 👀","Ah yes. The classic 'there was never a hoodie' defence. Absolutely airtight."]],"after":"I can already picture the innocent face. The one that says 'I have done nothing wrong' while actively doing something wrong."},{"tag":"The international cuddling crisis","title":"An affection <em>emergency.</em>","intro":"An urgent report has arrived: there are apparently hugs that have been waiting far too long to happen. The queue is getting out of hand.","question":"How would you like to resolve the situation?","options":[["One ridiculously long hug.","The timer has broken. The hug is now legally classified as a residence."],["Hugs every fifteen minutes.","A very demanding schedule. The Department of Personal Space has resigned."]],"after":"Some wishes are wonderfully simple. No fancy plans, no perfect scenery. Just being close enough that the miles stop having an opinion."},{"tag":"The very important inspection","title":"A morning <em>inspection.</em>","intro":"Somewhere, an imaginary clipboard has appeared. Apparently there are serious concerns about untidy hair, sleepy faces, and whether anyone has eaten breakfast.","question":"What happens first?","options":[["Mess up his hair.","A bold choice. The hairstyle had a promising future. Had."],["Demand a sleepy hug.","Approved. The day may begin once the hug has been properly administered."]],"after":"I like the way you find entire little adventures inside the most ordinary mornings."},{"tag":"A very strange job application","title":"Position: chief <em>troublemaker.</em>","intro":"A new job opening has appeared. Responsibilities include interrupting serious work, stealing attention, and smiling like none of it was intentional.","question":"Which qualification would you put on your résumé?","options":[["Expert at annoying lovingly.","Five stars. References include a very distracted human."],["Professional cheek-puller.","An extremely niche skill. The hiring committee is terrified."]],"after":"You have a talent for making mischief sound like a love language. It is frankly unfair to the rest of us."},{"tag":"The mysterious staring contest","title":"What? <em>Whattt?</em>","intro":"Picture this: someone is quietly doing their own thing. Someone else is staring. Not saying a word. Just staring with the confidence of a person who knows exactly what they're doing.","question":"What happens when they finally ask, 'What?'","options":[["Nothinggg. 😇","A suspiciously innocent answer. The jury is unconvinced."],["I just like looking at you.","Oh. Well. That's unfairly sweet. I had a joke ready and everything."]],"after":"It's the tiny imagined moments that get me. The ones that sound silly until you realise how lovely they would be."},{"tag":"The no-instruction-manual problem","title":"Someone should invent <em>this.</em>","intro":"Technology can do a thousand impressive things, yet somehow nobody has figured out how to send a proper hug through a screen. A spectacular failure of innovation.","question":"Which invention are we funding first?","options":[["A hug-delivery button.","Press once for a hug. Hold for the deluxe, won't-let-go version."],["A five-minute teleport.","Five minutes? Preet, you would spend four of them arguing about when to leave."]],"after":"Until the inventors get their act together, we make do with words, laughter, and those little messages that arrive at exactly the right time."},{"tag":"A letter without a clever disguise","title":"Something I <em>mean.</em>","intro":"I could have written you a simple birthday wish. But there are things I've wanted you to know properly, without rushing them, hiding them behind a joke, or hoping you'll somehow guess. So here's a letter you can take your time with.","question":"How shall we open it?","options":[["Gently. It's a letter.","Very graceful. I shall pretend I sealed it with wax and impeccable handwriting."],["OPEN IT ALREADY.","The envelope has been defeated in combat. Your prize: feelings."]],"letter":true,"after":"Dear Preet,\n\nHappy birthday, you wonderfully impossible human.\n\nI have been thinking about what I want to say to you today, and the funny thing is, for someone who can talk complete nonsense for hours, I still find myself searching for the right words when something really matters. I don't want to give you a collection of pretty sentences that sound nice for a minute and disappear. I want to tell you something real. Something you can come back to on an ordinary day and still feel the care behind it.\n\nI'm glad you exist, Preet. Not just because today happens to be your birthday, and not just because of the lovely moments we have shared. I'm glad for the person you are, even in the moments you probably don't think much about. The way you can turn a small thought into an entire conversation. The way you find humor in ridiculous situations. The way your affection can be so mischievous one minute and so tender the next. The way you care deeply, even when finding the words for it isn't easy. There is so much about you that deserves to be noticed, and I hope you never have to make yourself smaller to be understood.\n\nI wish you could see yourself through kinder eyes on the days when you are hard on yourself. You are not required to be cheerful all the time, or strong all the time, or easy to understand every single day. You are allowed to have complicated feelings. You are allowed to need a little extra attention, a little patience, a little softness. None of that makes you any less lovely. It simply makes you human, and I hope the people in your life remember to love the whole of you, not just the bright and effortless parts.\n\nAnd I want to say something clearly, because some things deserve to be said without puzzles: you matter to me. I care about how your day goes. I care whether you've eaten, whether something has been weighing on your mind, whether you got a moment to rest, whether you found something to laugh about. I care about the things you tell me and the little things you might think aren't important enough to mention. I want to hear them anyway. The small stories count. Your feelings count. You count.\n\nThere are moments when I miss you in the most ordinary ways. When something funny happens and I think you would have the perfect ridiculous response. When I hear something interesting and wish I could tell you immediately. When the day grows quiet and I find myself wishing we could talk a little longer. I miss the conversations that go nowhere in particular, the playful arguments that somehow become funny, and the comfortable feeling of being able to say something completely silly without having to explain myself. You have a way of making distance feel both very real and strangely small.\n\nI know miles and clocks don't always make things easy. I can't make a screen turn into a doorway, although I would happily file a formal complaint with whoever is responsible for that design flaw. But I can be more intentional with the ways I show up. I can tell you when I miss you instead of expecting you to read my mind. I can listen when something is important to you. I can try to understand rather than retreat into silence. I won't pretend I always get everything right, but I don't want care to be something you have to guess at.\n\nI also hope you know that you never have to perform happiness for me. If you're having a wonderful day, I want to hear every detail. If you're having a terrible one, you don't need to package it neatly before telling me. If you're annoyed, tired, excited, uncertain, or just in the mood to say absolutely nothing useful, there is room for that too. You deserve to be met with kindness in all those versions of yourself. Especially the ones that don't feel polished.\n\nI think one of the loveliest things about you is how much life you can fit into a small moment. A sleepy morning can become a whole imaginary adventure. An ordinary conversation can turn into an absurd courtroom drama. A tiny bit of teasing can carry so much warmth underneath it. And somewhere in all that delightful chaos is a person with a very gentle heart. I hope you protect that heart without ever feeling you need to hide it.\n\nFor this new year of your life, I wish you more than success, though I hope you get plenty of that too. I wish you peace that doesn't depend on everything going perfectly. I wish you friendships that feel safe, laughter that catches you off guard, restful nights, good food, exciting little plans, and mornings that don't ask too much of you. I wish you courage for the things you're dreaming of and patience for the things that take longer than expected. I hope you get to feel proud of yourself, not only for the big milestones, but for all the quiet ways you keep going.\n\nI hope you are surprised by good things. I hope the right doors open. I hope you discover new places and return to familiar ones with happy stories. I hope you dance when there's no particular reason, laugh until your stomach hurts, and take pictures you forget about until they make you smile months later. I hope there are days so simple and good that you don't even realise they're becoming memories.\n\nAnd when life isn't gentle, as life sometimes isn't, I hope you remember this: you don't have to figure everything out in one night. You don't have to carry every worry alone. You are allowed to ask for reassurance, to need comfort, to begin again, and to take your time. I hope I can be someone who makes those moments a little easier rather than heavier. Someone who listens, says what he means, and doesn't make tenderness unnecessarily complicated.\n\nIf I could give you one thing beyond all the silly surprises on this website, it would be the feeling of being genuinely seen. Not watched from a distance, not admired only when everything is lovely, but understood in the small, messy, funny, thoughtful details that make you yourself. I can't fit that feeling into a gift box. So I made you these pages instead, with their ridiculous questions, imaginary celebrations, and entirely unnecessary levels of birthday administration. Every bit of it is my way of saying that you were worth the thought.\n\nPlease keep being curious. Keep laughing at absurd things. Keep telling stories with too many details. Keep asking for what you need. Keep being soft when you want to be soft and wonderfully dramatic when the occasion absolutely does not require it. I hope the world is generous with you, Preet. And I hope you are generous with yourself.\n\nHappy birthday. I am grateful for the moments we've had, for the ones we haven't had yet, and for the simple fact that somewhere under a different sky, there's you.\n\nYou are cared for. You are missed. You are appreciated. And you don't have to decode a single one of those sentences.\n\nWith so much warmth, and a smile you would probably make fun of."},{"tag":"Exhibit A: a moment","title":"Proof that ordinary <em>isn't ordinary.</em>","intro":"Not every good memory arrives with dramatic lighting and a soundtrack. Some just happen while nobody is paying attention.","question":"What shall we call this one?","options":[["A little time capsule.","Filed under: things worth remembering when the day needs rescuing."],["Evidence of our nonsense.","Your honour, the photograph speaks for itself. We have no further questions."]],"photo":true,"after":"It's funny how a moment can be small while you're living it, and lovely when you look back."},{"tag":"An extremely scientific study","title":"Your smile is <em>suspicious.</em>","intro":"Researchers have been unable to explain how one person's smile can rearrange the mood of an entire day. The researchers are me. The funding is zero.","question":"How do you respond to these findings?","options":[["Sounds scientifically accurate.","Peer reviewed by a very biased committee of one. Still counts."],["Stop being dramatic 😂","I would, but my drama subscription renewed automatically."]],"after":"I hope the coming year gives you so many reasons to smile that even your cheeks start filing complaints."},{"tag":"The extremely normal conversation","title":"Tell me <em>everything.</em>","intro":"Not the polished, highlight-reel version of a day. The little bits. The weird thought. The thing that made you laugh. The tiny inconvenience that deserved a full dramatic retelling.","question":"What's the first thing you tell me?","options":[["The most random thought ever.","Perfect. I have cleared my schedule for this very important nonsense."],["A tiny thing that happened today.","Tell me. I want the small stories too. Especially the small stories."]],"after":"Somehow, hearing about someone's ordinary day can become one of the best parts of your own."},{"tag":"A complaint from the time zones","title":"Different skies, <em>same moon.</em>","intro":"One person is yawning. The other is wide awake. The clocks are behaving like they have a personal grudge. And still, a message finds its way across.","question":"If the clocks gave us one extra hour, what would you do?","options":[["Talk until we forget the time.","The clocks are furious. For once, I think we should ignore them."],["Just stay there, quietly.","No performance. No clever lines. Just the lovely feeling of not having to rush."]],"after":"Distance makes some things complicated. It also makes the simplest moments feel unexpectedly precious."},{"tag":"A tiny act of rebellion","title":"A little <em>less armour.</em>","intro":"You once made a beautiful point without even trying: closeness isn't about finding perfect words. Sometimes it's just choosing not to disappear when the conversation gets difficult.","question":"What should matter more on the messy days?","options":[["Being heard, even when I'm upset.","Yes. Not every feeling needs fixing. Sometimes it needs someone willing to stay and listen."],["A little reassurance, please.","You shouldn't have to solve a puzzle to know you matter. You do. Clearly, plainly, and on the messy days too."]],"after":"I hope your birthday is full of light. And I hope you always find tenderness on the days that aren't."},{"tag":"An unofficial smile audit","title":"Did you just <em>smile?</em>","intro":"Somewhere in the middle of this absurdly long website, there is a very real possibility that you have smiled at your screen. The authorities are investigating.","question":"Would you care to comment?","options":[["No comment. 😌","Noted. The corners of your mouth have submitted a conflicting statement."],["Maybe I did, idiot.","Wonderful. That's one successful long-distance hug, delivered entirely through nonsense."]],"after":"If a few words can make your day a little softer, then every ridiculous line here has done its job."},{"tag":"Department of unnecessary arguments","title":"A little <em>troublemaker.</em>","intro":"Some conversations are peaceful. Others begin with 'Excuse me?' and end with two people laughing at something neither of them can explain.","question":"You've started a tiny argument. What's your opening statement?","options":[["I'm right. Next question.","Powerful argument. No evidence. Remarkable confidence. The judge is impressed."],["First, bring snacks.","A skilled negotiator. The peace treaty now smells delicious."]],"after":"I hope you always keep that wonderfully mischievous spark. The world has enough people pretending to be terribly serious."},{"tag":"An urgent snack-related dilemma","title":"A delicious <em>crisis.</em>","intro":"You are standing before two excellent possibilities. A dramatic soundtrack begins. Somewhere, a food critic faints.","question":"What's your first move?","options":[["🥟 The crispy one.","A crunchy decision. The entire jury nods with its mouth full."],["🍯 The sweet one.","A golden, spiralling victory. Elegance has never been stickier."]],"after":"Naturally, you get both. This is your birthday. I refuse to run a cruel establishment."},{"tag":"The ministry of absolutely nothing","title":"Five more <em>minutes.</em>","intro":"There are conversations where you solve the world's problems. And conversations where you discuss complete nonsense and somehow feel better afterward.","question":"If we had five extra minutes, what would you pick?","options":[["Tell me something real.","Then here's something real: I like hearing about your day, even the bits you think are too small to mention."],["Let's be idiots.","Excellent. I have been training for this role my entire life."]],"after":"I like that we don't always need a grand topic. Sometimes the best part is simply getting to talk."},{"tag":"A note for the less sparkly days","title":"You can put the <em>armour down.</em>","intro":"Even people who make everyone laugh have days when the world feels heavy. This page is for those days, too.","question":"What would feel nicest to hear today?","options":[["You don't have to be okay all the time.","You really don't. You can be tired, uncertain, or quiet. You deserve patience on those days too."],["You don't have to explain everything.","You are allowed to feel things before you find words for them. And you deserve someone willing to listen."]],"after":"May you always have places where you can be completely yourself: loud, soft, silly, serious, and everything in between."},{"tag":"An extremely legitimate birthday ritual","title":"Make a <em>wish.</em>","intro":"The imaginary cake has arrived. It is magnificent. It has zero calories and absolutely no structural integrity. Please approach with dignity. 🎂","question":"How are you making your wish?","options":[["Eyes closed. Very serious.","A hush falls over the room. Even the imaginary cake is being respectful."],["I want unlimited wishes.","A classic loophole. The Birthday Committee is furious but powerless."]],"confetti":true,"after":"I hope a wish you haven't told anyone about finds its way to you. And I hope life surprises you with a few lovely things you never thought to wish for."},{"tag":"The cake-cutting ceremony","title":"The first slice is <em>yours.</em>","intro":"A birthday cake has arrived. Nobody knows how it passed security. It looks suspiciously delicious, and the candles have already started gossiping.","question":"How shall we cut it, birthday girl?","options":[["The biggest slice. Obviously.","A perfectly reasonable demand. The cake has accepted its fate."],["A tiny, elegant slice.","How sophisticated. We both know you'll be back for seconds."]],"cake":true,"after":"Here’s to a year with more sweetness than you know what to do with. And yes, you get the first bite."},{"tag":"A little something, just for you","title":"Wait. There's a <em>present.</em>","intro":"I couldn't send a ribbon-wrapped box through the screen, so I did the next best thing. There's something waiting here. It's small, but I meant every bit of it.","question":"How are we opening this suspicious package?","options":[["Very carefully. 🎀","The ribbon appreciates your excellent manners."],["SHAKE IT FIRST.","A bold strategy. The gift would like to speak to its lawyer."]],"gift":true,"after":"A little gift with no expiry date: one day, entirely at your pace. The snacks you choose, the conversations that wander, the laughter that interrupts us, and no rush to be anywhere else. Until then, you have my attention, my honesty, and a standing invitation to tell me about even the smallest part of your day."},{"tag":"The final page, allegedly","title":"For the girl <em>reading this.</em>","intro":"There it is. An entire tiny adventure when three words might have done. I did warn you I wasn't good at keeping things simple.","question":"Before you go, what's the verdict?","options":[["I smiled. Happy now?","Ridiculously. I'd do this all over again for that one smile."],["You're such an idiot 😂","Guilty as charged. But an idiot who means every kind word on this page."]],"after":"Happy birthday, Preet. I hope you feel celebrated today, and cared for on the ordinary days too. You don't have to guess whether you matter to me. You do. Very much. And yes, I am aware that this is an absurdly elaborate way of saying it."}];
let index=0,chosen=-1;const stage=document.getElementById('stage'),count=document.getElementById('count'),bar=document.getElementById('bar');
function escapeText(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const step=steps[index];chosen=-1;count.textContent=String(index+1).padStart(2,'0')+' / '+String(steps.length).padStart(2,'0');bar.style.width=(index/steps.length*100)+'%';stage.className='stage';stage.innerHTML='<div class="eyebrow">'+step.tag+'</div><h1>'+step.title+'</h1><p class="intro">'+step.intro+'</p><p class="prompt">'+step.question+'</p><div class="choices">'+step.options.map((o,i)=>'<button class="choice" data-choice="'+i+'"><span>OPTION 0'+(i+1)+'</span><strong>'+o[0]+'</strong></button>').join('')+'</div><div id="reaction" class="reaction" hidden></div>';stage.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>choose(Number(btn.dataset.choice))));}
function choose(i){if(chosen!==-1)return;chosen=i;const step=steps[index];stage.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});const reaction=document.getElementById('reaction');reaction.hidden=false;let extra='';
if(step.letter){extra='<article class="letter-paper"><h2>Dear Preet,</h2>'+step.after.split('\n\n').map(p=>'<p>'+escapeText(p)+'</p>').join('')+'<p><em>With warmth, always.</em></p></article>'}
else if(step.photo){extra='<figure class="visual"><img src="assets/preview.png" alt="A shared memory" loading="lazy"><figcaption class="caption">One of those moments worth keeping.</figcaption></figure><p>'+escapeText(step.after)+'</p>'}
else if(step.cake){extra='<div class="birthday-scene" id="cakeScene"><div class="cake-wrap"><div class="candles"><i></i><i></i><i></i></div><div class="cake-top"></div><div class="cake-base"><span>HAPPY BIRTHDAY PREET</span></div><div class="cake-slice" aria-hidden="true"></div></div><div class="scene-message" id="cakeMessage">Make your first cut ✨</div><button class="scene-action" id="cakeAction" type="button">🔪 Cut the cake</button></div><p>'+escapeText(step.after)+'</p>'}else if(step.gift){extra='<div class="birthday-scene" id="giftScene"><div class="gift-box" aria-hidden="true"><div class="gift-lid"></div><div class="gift-body"><div class="gift-ribbon"></div></div></div><div class="gift-reveal" id="giftReveal" hidden><span class="gift-small">A GIFT, JUST FOR PREET</span><h3>One unhurried day. ♡</h3><p>A little promise of time, attention, laughter, your favourite treats, and conversations that don’t need a reason.</p><small>VALID FOREVER · NO EXPIRY DATE</small></div><button class="scene-action" id="giftAction" type="button">🎁 Untie the ribbon</button></div><p>'+escapeText(step.after)+'</p>'}else{extra='<p>'+escapeText(step.after)+'</p>'}
reaction.innerHTML='<b>'+escapeText(step.options[i][1])+'</b>'+extra+'<button class="next" id="next">'+(index===steps.length-1?'Play again, Preet ↺':'See what’s next →')+'</button>';
document.getElementById('next').addEventListener('click',()=>{index=index===steps.length-1?0:index+1;render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
if(step.cake){document.getElementById('cakeAction').addEventListener('click',()=>{const scene=document.getElementById('cakeScene');scene.classList.add('cut');document.getElementById('cakeMessage').textContent='First slice for the birthday girl! 🍰';document.getElementById('cakeAction').textContent='🍰 Cake officially served';document.getElementById('cakeAction').disabled=true;celebrate('confetti',34)},{once:true})}if(step.gift){document.getElementById('giftAction').addEventListener('click',()=>{document.getElementById('giftScene').classList.add('opened');document.getElementById('giftReveal').hidden=false;document.getElementById('giftAction').textContent='♡ Yours to keep';document.getElementById('giftAction').disabled=true;celebrate('hearts',25)},{once:true})}if(step.confetti)celebrate('confetti',36);else if([0,1,5,10,16,21].includes(index))celebrate('sparkles',18);else if([3,9,18].includes(index))celebrate('hearts',12);
bar.style.width=((index+1)/steps.length*100)+'%';
}

// Soft, original ambient music generated in the browser: no external music file or licensing dependency.
let audioCtx=null,master=null,musicTimer=null,musicEnabled=true,noteIndex=0;
const musicButton=document.getElementById('musicToggle');
const progression=[[261.63,329.63,392],[220,261.63,329.63],[174.61,261.63,349.23],[196,293.66,392]];
function playChord(){
 if(!audioCtx||audioCtx.state!=='running'||!musicEnabled)return;
 const now=audioCtx.currentTime,notes=progression[noteIndex++%progression.length];
 notes.forEach((freq,j)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq/2;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.045/(j+1),now+.75);gain.gain.exponentialRampToValueAtTime(.0001,now+4.9);osc.connect(gain);gain.connect(master);osc.start(now);osc.stop(now+5);});
}
async function startMusic(){
 if(!musicEnabled)return;
 try{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.22;master.connect(audioCtx.destination);}
 await audioCtx.resume();if(!musicTimer){playChord();musicTimer=setInterval(playChord,4400);}
 musicButton.textContent='♫ Music: on';musicButton.setAttribute('aria-pressed','true');
 }catch(e){musicButton.textContent='♫ Tap for music';}
}
musicButton.addEventListener('click',()=>{if(musicEnabled&&audioCtx&&audioCtx.state==='running'){musicEnabled=false;audioCtx.suspend();clearInterval(musicTimer);musicTimer=null;musicButton.textContent='♫ Music: off';musicButton.setAttribute('aria-pressed','false')}else{musicEnabled=true;startMusic()}});
document.addEventListener('pointerdown',()=>{if(musicEnabled)startMusic()},{once:true});
document.addEventListener('keydown',()=>{if(musicEnabled)startMusic()},{once:true});
startMusic(); // Browsers may block sound until her first tap; it then starts automatically.
function celebrate(kind,n){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 for(let i=0;i<n;i++){const el=document.createElement('span');el.className='spark'+(kind==='hearts'?' heart float':'');el.textContent=kind==='hearts'?'♡':kind==='confetti'?['✦','·','✧','✳'][i%4]:['✧','✦','⋆'][i%3];
 el.style.left=(4+Math.random()*92)+'vw';el.style.top=kind==='hearts'?(75+Math.random()*18)+'vh':'-30px';el.style.animationDelay=(Math.random()*1.2)+'s';el.style.fontSize=(13+Math.random()*16)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),5200);}
}
render();
