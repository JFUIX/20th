<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110a11"><title>Dear Preet — A Little Birthday Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#100b10;--pink:#fa88ad;--cream:#fff0f4;--muted:#d8b7c5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 15%,#60203b55,transparent 48%),radial-gradient(ellipse at 0% 90%,#5c1b3655,transparent 45%),var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}header{max-width:950px;margin:auto;padding:25px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font:italic 24px 'Playfair Display',serif;color:var(--pink)}.top-note{color:#c9a2b3;font-size:11px;letter-spacing:.2em;text-transform:uppercase}.wrap{width:min(100% - 34px,760px);margin:45px auto 70px;min-height:570px;display:flex;flex-direction:column;justify-content:center}.progress{height:3px;background:#ffffff20;border-radius:5px;overflow:hidden}.progress>div{height:100%;background:var(--pink);width:0;transition:width .55s}.counter{display:flex;justify-content:space-between;align-items:center;color:#d6aabb;letter-spacing:.18em;font-size:11px;margin:16px 0 40px;text-transform:uppercase}.stage{animation:arrive .55s both}@keyframes arrive{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}.eyebrow{color:var(--pink);font-size:12px;letter-spacing:.35em;text-transform:uppercase;font-weight:700}.stage h1{font:400 clamp(47px,9vw,91px)/1.08 'Playfair Display',serif;letter-spacing:-.055em;margin:19px 0 24px}.stage h1 em{color:var(--pink);font-weight:400}.intro{font:400 clamp(18px,3vw,24px)/1.65 'Playfair Display',serif;color:#f0d4df;max-width:650px;margin:0 0 28px}.prompt{font-size:15px;color:#e9b8ca;margin:26px 0 17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{min-height:100px;text-align:left;padding:22px;background:#251520;border:1px solid #fa88ad55;border-radius:12px;color:var(--cream);transition:transform .2s,border-color .2s,background .2s}.choice:hover{transform:translateY(-3px);border-color:var(--pink);background:#3d1c30}.choice span{display:block;color:var(--pink);font-size:12px;margin-bottom:9px;letter-spacing:.12em}.choice strong{font:400 clamp(17px,3vw,23px) 'Playfair Display',serif}.choice:disabled{cursor:default;opacity:.7;transform:none}.choice.selected{border-color:var(--pink);background:#55233e;opacity:1}.reaction{margin-top:25px;border-left:2px solid var(--pink);padding:8px 0 8px 20px;animation:arrive .5s both}.reaction b{color:var(--pink);font-size:12px;letter-spacing:.2em;text-transform:uppercase}.reaction p{font:italic 21px/1.6 'Playfair Display',serif;margin:10px 0 18px}.next,.restart{border:0;border-radius:100px;background:var(--pink);color:#200b15;font-weight:700;padding:15px 27px;transition:transform .2s}.next:hover,.restart:hover{transform:translateY(-2px)}.visual{margin:25px 0;max-width:430px}.visual img{width:100%;display:block;border-radius:4px;filter:grayscale(1);box-shadow:0 15px 60px #0008}.caption{font:italic 14px 'Playfair Display',serif;color:#d6aabb;margin-top:12px}.letter-paper{background:#f9e3e9;color:#4d2436;padding:30px;border-radius:5px;margin:25px 0;box-shadow:0 18px 50px #0005;animation:arrive .7s both}.letter-paper p{font:18px/1.85 'Playfair Display',serif}.letter-paper h2{font:36px 'Playfair Display',serif}.spark{position:fixed;pointer-events:none;z-index:9;animation:fall 2.8s linear forwards;color:var(--pink)}@keyframes fall{to{transform:translateY(110vh) rotate(300deg);opacity:0}}footer{text-align:center;padding:22px;color:#b88599;font-size:12px;letter-spacing:.15em}@media(max-width:540px){.wrap{margin:12px auto 50px;min-height:560px}.counter{margin-bottom:32px}.choices{grid-template-columns:1fr}.choice{min-height:77px;padding:17px}.stage h1{font-size:clamp(47px,13vw,70px)}.top-note{font-size:9px}.letter-paper{padding:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><header><div class="brand">Dear Preet.</div><div class="top-note">A birthday made for one</div></header>
<main class="wrap"><div class="progress" aria-label="Story progress"><div id="bar"></div></div><div class="counter"><span id="count">01 / 11</span><span>Preet, this is your story</span></div><div id="stage" class="stage" aria-live="polite"></div></main><footer>MADE WITH THOUGHT, FOR PREET · HAPPY BIRTHDAY</footer>
<script>
const steps=[
{tag:'A tiny interruption to your day',title:'Oh, <em>hello you.</em>',intro:'Look who wandered into this suspiciously pink corner of the internet. There are no terms and conditions. There is, however, a considerable amount of nonsense.',question:'Shall we see what all this fuss is about?',options:[['Fine. Impress me.','Oh, the pressure. I have exactly one brain cell and it is wearing a party hat.'],['Is this a trap?','A very elaborate one. The only danger is smiling against your will.']],after:'Excellent. You have officially entered a place where logic has taken the evening off.'},
{tag:'The occasion',title:'Another trip <em>around the sun.</em>',intro:'Somewhere in the universe, the stars are doing their usual thing. Meanwhile, down here, today feels a little more worth noticing.',question:'How are we entering this new chapter?',options:[['Like a main character','As you should. Someone cue the dramatic wind machine.'],['With absolutely no plan','Perfect. The best stories rarely ask for permission first.']],after:'May this next chapter have soft mornings, outrageous laughter, and just enough chaos to make the stories good.'},
{tag:'A folded piece of honesty',title:'There’s a <em>letter.</em>',intro:'I wrote something. Then rewrote it. Then stared at it like it owed me money. Anyway, here it is.',question:'How would you like to open it?',options:[['Carefully, please','Very elegant. I’m pretending I used expensive stationery.'],['TEAR IT OPEN','A woman of action. The imaginary envelope never stood a chance.']],letter:true,after:'Dear Preet,\n\nI hope you know there are people whose presence feels like finding a quiet little song in the middle of a noisy day. You have that sort of magic. Not the loud, fireworks kind. The kind that lingers.\n\nI hope life surprises you gently this year. I hope you laugh so hard you forget what started it. I hope the things you are quietly wishing for find their way to you, even the ones you haven’t said out loud.\n\nAnd when the days feel a little too long, I hope you remember how much loveliness you carry into ordinary moments without even trying.\n\nI made this ridiculous little thing because a plain happy birthday felt far too ordinary for you.\n\nHappy birthday, Preet. Stay wonderfully, impossibly you.'},
{tag:'An accidental time capsule',title:'A moment <em>worth keeping.</em>',intro:'You know those moments that seem ordinary until they become the ones you remember? Here’s a tiny piece of one.',question:'How do we file this memory?',options:[['In the good ones','Right beside the moments that still make us grin for no reason.'],['Under “evidence”','Your honour, I submit Exhibit A: an extremely good day.']],photo:true,after:'Nothing staged. Nothing grand. Just a moment that deserves to stay a little longer.'},
{tag:'A completely unbiased observation',title:'That <em>smile.</em>',intro:'Some smiles enter a room politely. Yours apparently forgot how doors work.',question:'How are we handling this compliment?',options:[['I’ll allow it','Thank you, your majesty. I shall frame this approval.'],['Absolutely not 😂','Complaint received. Compliment remains non-refundable.']],after:'I hope the coming year gives you a thousand new reasons to smile like that.'},
{tag:'A minor disturbance',title:'The art of <em>being impossible.</em>',intro:'Some people are a peaceful cup of tea. Others are the entire tea set falling down the stairs. Somehow, both can be charming.',question:'If a tiny argument breaks out, what’s the strategy?',options:[['I’m obviously right','Naturally. I’ll notify the international court of absolutely nothing.'],['I demand snacks','A remarkably mature diplomatic solution. Negotiations may proceed.']],after:'May your days be full of laughter, your debates gloriously unserious, and your victories mostly imaginary.'},
{tag:'A culinary emergency',title:'Crispy or <em>sweet?</em>',intro:'Imagine the world is ending in five minutes. Very inconvenient. But the snack counter is still open.',question:'What are you saving first?',options:[['🥟 Something crispy','A bold choice. Crunch first, existential questions later.'],['🍯 Something sweet','An elegant spiral into excellent decision-making.']],after:'Plot twist: the world does not end. You get both. The universe has finally done something sensible.'},
{tag:'The beautiful nonsense department',title:'Words, words, <em>words.</em>',intro:'The strangest conversations are sometimes the ones that stay. One minute you’re discussing life. The next, you’re defending an opinion nobody asked for.',question:'What kind of conversation are we having tonight?',options:[['A deep one','Alright, philosopher. We’ll solve the universe and forget why we started.'],['Utter nonsense','A magnificent choice. We shall achieve absolutely nothing, spectacularly.']],after:'Here’s to the conversations that take the scenic route and somehow feel like home.'},
{tag:'A note for another day',title:'For when the world <em>gets loud.</em>',intro:'This part isn’t really a joke. Well, not entirely. Even the brightest people deserve somewhere gentle to land.',question:'Which little note would you like to keep?',options:[['A little courage','You are allowed to begin again, slowly, awkwardly, beautifully. There is no deadline on becoming.'],['A little comfort','Rest is not falling behind. You don’t have to earn softness by being strong all the time.']],after:'Whatever kind of day finds you, I hope it meets you with kindness. And when it doesn’t, I hope you give yourself some.'},
{tag:'The official wish-making ceremony',title:'One wish. <em>Or several.</em>',intro:'Please approach the imaginary birthday candles with the seriousness this very unserious ceremony deserves. 🎂',question:'How are we making this wish?',options:[['Eyes closed, obviously','The universe is listening. Or pretending to. Either way, excellent technique.'],['I’m wishing for more wishes','An impressive loophole. The birthday committee reluctantly approves.']],confetti:true,after:'May something you’ve been quietly hoping for find you when you least expect it. And may the ordinary days be beautiful too.'},
{tag:'The last page (for now)',title:'And then there’s <em>you.</em>',intro:'If you made it all the way here, congratulations. You survived my very dramatic attempt at saying three simple words.',question:'So… final verdict on this tiny adventure?',options:[['I smiled, okay?','That’s all I was hoping for. I can retire from the birthday business now.'],['You’re ridiculous 😂','Correct. And yet you read every page. Curious. Very curious.']],after:'Happy birthday, Preet. May life be wonderfully strange, unexpectedly gentle, and generous with the little moments that make you feel alive. Somewhere between all the jokes, I hope you felt the part I meant most: you are worth celebrating.'}
];
let index=0,chosen=-1;const stage=document.getElementById('stage'),count=document.getElementById('count'),bar=document.getElementById('bar');
function escapeText(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const step=steps[index];chosen=-1;count.textContent=String(index+1).padStart(2,'0')+' / '+String(steps.length).padStart(2,'0');bar.style.width=(index/steps.length*100)+'%';stage.className='stage';stage.innerHTML='<div class="eyebrow">'+step.tag+'</div><h1>'+step.title+'</h1><p class="intro">'+step.intro+'</p><p class="prompt">'+step.question+'</p><div class="choices">'+step.options.map((o,i)=>'<button class="choice" data-choice="'+i+'"><span>OPTION 0'+(i+1)+'</span><strong>'+o[0]+'</strong></button>').join('')+'</div><div id="reaction" class="reaction" hidden></div>';stage.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>choose(Number(btn.dataset.choice))));}
function choose(i){if(chosen!==-1)return;chosen=i;const step=steps[index];stage.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});const reaction=document.getElementById('reaction');reaction.hidden=false;let extra='';
if(step.letter){extra='<article class="letter-paper"><h2>Dear Preet,</h2>'+step.after.split('\n\n').map(p=>'<p>'+escapeText(p)+'</p>').join('')+'<p><em>With warmth, always.</em></p></article>'}
else if(step.photo){extra='<figure class="visual"><img src="assets/preview.png" alt="A shared memory" loading="lazy"><figcaption class="caption">One of those moments worth keeping.</figcaption></figure><p>'+escapeText(step.after)+'</p>'}
else{extra='<p>'+escapeText(step.after)+'</p>'}
reaction.innerHTML='<b>'+escapeText(step.options[i][1])+'</b>'+extra+'<button class="next" id="next">'+(index===steps.length-1?'Play again, Preet ↺':'See what’s next →')+'</button>';
document.getElementById('next').addEventListener('click',()=>{index=index===steps.length-1?0:index+1;render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
if(step.confetti){for(let n=0;n<28;n++){const el=document.createElement('span');el.className='spark';el.textContent=n%2?'✦':'·';el.style.left=Math.random()*100+'vw';el.style.top='-30px';el.style.animationDelay=Math.random()+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),4000)}}
bar.style.width=((index+1)/steps.length*100)+'%';
}
render();
</script></body></html>
