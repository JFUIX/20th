<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110a11"><title>Dear Preet — A Little Birthday Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#100b10;--pink:#fa88ad;--cream:#fff0f4;--muted:#d8b7c5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 15%,#60203b55,transparent 48%),radial-gradient(ellipse at 0% 90%,#5c1b3655,transparent 45%),var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}header{max-width:950px;margin:auto;padding:25px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font:italic 24px 'Playfair Display',serif;color:var(--pink)}.top-note{color:#c9a2b3;font-size:11px;letter-spacing:.2em;text-transform:uppercase}.wrap{width:min(100% - 34px,760px);margin:45px auto 70px;min-height:570px;display:flex;flex-direction:column;justify-content:center}.progress{height:3px;background:#ffffff20;border-radius:5px;overflow:hidden}.progress>div{height:100%;background:var(--pink);width:0;transition:width .55s}.counter{display:flex;justify-content:space-between;align-items:center;color:#d6aabb;letter-spacing:.18em;font-size:11px;margin:16px 0 40px;text-transform:uppercase}.stage{animation:arrive .55s both}@keyframes arrive{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}.eyebrow{color:var(--pink);font-size:12px;letter-spacing:.35em;text-transform:uppercase;font-weight:700}.stage h1{font:400 clamp(47px,9vw,91px)/1.08 'Playfair Display',serif;letter-spacing:-.055em;margin:19px 0 24px}.stage h1 em{color:var(--pink);font-weight:400}.intro{font:400 clamp(18px,3vw,24px)/1.65 'Playfair Display',serif;color:#f0d4df;max-width:650px;margin:0 0 28px}.prompt{font-size:15px;color:#e9b8ca;margin:26px 0 17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{min-height:100px;text-align:left;padding:22px;background:#251520;border:1px solid #fa88ad55;border-radius:12px;color:var(--cream);transition:transform .2s,border-color .2s,background .2s}.choice:hover{transform:translateY(-3px);border-color:var(--pink);background:#3d1c30}.choice span{display:block;color:var(--pink);font-size:12px;margin-bottom:9px;letter-spacing:.12em}.choice strong{font:400 clamp(17px,3vw,23px) 'Playfair Display',serif}.choice:disabled{cursor:default;opacity:.7;transform:none}.choice.selected{border-color:var(--pink);background:#55233e;opacity:1}.reaction{margin-top:25px;border-left:2px solid var(--pink);padding:8px 0 8px 20px;animation:arrive .5s both}.reaction b{color:var(--pink);font-size:12px;letter-spacing:.2em;text-transform:uppercase}.reaction p{font:italic 21px/1.6 'Playfair Display',serif;margin:10px 0 18px}.next,.restart{border:0;border-radius:100px;background:var(--pink);color:#200b15;font-weight:700;padding:15px 27px;transition:transform .2s}.next:hover,.restart:hover{transform:translateY(-2px)}.visual{margin:25px 0;max-width:430px}.visual img{width:100%;display:block;border-radius:4px;filter:grayscale(1);box-shadow:0 15px 60px #0008}.caption{font:italic 14px 'Playfair Display',serif;color:#d6aabb;margin-top:12px}.letter-paper{background:#f9e3e9;color:#4d2436;padding:30px;border-radius:5px;margin:25px 0;box-shadow:0 18px 50px #0005;animation:arrive .7s both}.letter-paper p{font:18px/1.85 'Playfair Display',serif}.letter-paper h2{font:36px 'Playfair Display',serif}.spark{position:fixed;pointer-events:none;z-index:9;animation:fall 2.8s linear forwards;color:var(--pink)}@keyframes fall{to{transform:translateY(110vh) rotate(300deg);opacity:0}}footer{text-align:center;padding:22px;color:#b88599;font-size:12px;letter-spacing:.15em}@media(max-width:540px){.wrap{margin:12px auto 50px;min-height:560px}.counter{margin-bottom:32px}.choices{grid-template-columns:1fr}.choice{min-height:77px;padding:17px}.stage h1{font-size:clamp(47px,13vw,70px)}.top-note{font-size:9px}.letter-paper{padding:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
 .music-toggle{background:#251520;color:#ffd9e6;border:1px solid #fa88ad66;border-radius:99px;padding:10px 14px;font-size:12px;white-space:nowrap}.music-toggle:hover{border-color:var(--pink)}.spark.heart{font-size:20px;animation-duration:4s}.spark.float{animation:floatAway 3.8s ease-out forwards}@keyframes floatAway{0%{transform:translateY(20px) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-65vh) rotate(30deg);opacity:0}}@media(max-width:540px){header{flex-wrap:wrap}.music-toggle{margin-left:auto}} </style></head>
<body><header><div class="brand">Dear Preet.</div><div class="top-note">A birthday made for one</div><button type="button" id="musicToggle" class="music-toggle" aria-label="Toggle background music" aria-pressed="false">♫ Music: off</button></header>
<main class="wrap"><div class="progress" aria-label="Story progress"><div id="bar"></div></div><div class="counter"><span id="count">01 / 11</span><span>Preet, this is your story</span></div><div id="stage" class="stage" aria-live="polite"></div></main><footer>MADE WITH THOUGHT, FOR PREET · HAPPY BIRTHDAY</footer>
<script>
const steps=[{"tag":"A very official birthday investigation","title":"Well, well, <em>Preet.</em>","intro":"You have been summoned. Nothing alarming. Just a small matter involving a birthday, an unreasonable amount of effort, and someone who clearly doesn't know how to send a normal text.","question":"How would you like to respond to these allegations?","options":[["I demand an explanation.","Understandable. The suspect claims he was 'just making a little something.' The evidence suggests otherwise."],["I plead extremely cute.","The court agrees. Case dismissed. Unfortunately, the birthday nonsense must continue."]],"after":"Welcome, birthday girl. This is your tiny, slightly unhinged corner of the universe. Take your time. Every page is yours."},{"tag":"The annual celebration of you","title":"Another year of <em>you.</em>","intro":"Somewhere a calendar turned a page and the universe went, 'Oh. This one's important.' It didn't say why. I think it was trying to be mysterious.","question":"How should your grand entrance be announced?","options":[["With trumpets, obviously.","BAAAAAA. That was a trumpet. Please respect the production budget."],["Quietly. I'm mysterious.","Of course. A very mysterious person who has just pressed a button on a pink website."]],"after":"May this year surprise you in the nicest ways. May the difficult things grow lighter, the lovely things stay longer, and the ordinary Tuesdays turn out better than expected."},{"tag":"An emergency notice","title":"A serious <em>complaint.</em>","intro":"I have filed a formal complaint against the miles between us. They are being terribly unreasonable, refusing to fold themselves neatly into a paper airplane.","question":"What punishment does geography deserve?","options":[["Immediate dismissal.","Agreed. Geography has been fired. It says it has a family to feed. I remain unmoved."],["A strongly worded letter.","Dear Geography, your behaviour is embarrassing. Kindly become smaller. Regards, Everyone."]],"after":"Until distance learns some manners, there are still messages, ridiculous conversations, and the strange comfort of knowing someone is out there thinking of you."},{"tag":"The department of missing hoodies","title":"A very suspicious <em>disappearance.</em>","intro":"Imagine opening your wardrobe and discovering that your favourite hoodie has mysteriously developed a new owner. The new owner is looking extremely innocent.","question":"Preet, what is your official statement?","options":[["It looks better on me.","A compelling legal argument. The hoodie has requested permanent relocation."],["What hoodie? 👀","Ah yes. The classic 'there was never a hoodie' defence. Absolutely airtight."]],"after":"I can already picture the innocent face. The one that says 'I have done nothing wrong' while actively doing something wrong."},{"tag":"The international cuddling crisis","title":"An affection <em>emergency.</em>","intro":"An urgent report has arrived: there are apparently hugs that have been waiting far too long to happen. The queue is getting out of hand.","question":"How would you like to resolve the situation?","options":[["One ridiculously long hug.","The timer has broken. The hug is now legally classified as a residence."],["Hugs every fifteen minutes.","A very demanding schedule. The Department of Personal Space has resigned."]],"after":"Some wishes are wonderfully simple. No fancy plans, no perfect scenery. Just being close enough that the miles stop having an opinion."},{"tag":"The very important inspection","title":"A morning <em>inspection.</em>","intro":"Somewhere, an imaginary clipboard has appeared. Apparently there are serious concerns about untidy hair, sleepy faces, and whether anyone has eaten breakfast.","question":"What happens first?","options":[["Mess up his hair.","A bold choice. The hairstyle had a promising future. Had."],["Demand a sleepy hug.","Approved. The day may begin once the hug has been properly administered."]],"after":"I like the way you find entire little adventures inside the most ordinary mornings."},{"tag":"A very strange job application","title":"Position: chief <em>troublemaker.</em>","intro":"A new job opening has appeared. Responsibilities include interrupting serious work, stealing attention, and smiling like none of it was intentional.","question":"Which qualification would you put on your résumé?","options":[["Expert at annoying lovingly.","Five stars. References include a very distracted human."],["Professional cheek-puller.","An extremely niche skill. The hiring committee is terrified."]],"after":"You have a talent for making mischief sound like a love language. It is frankly unfair to the rest of us."},{"tag":"The mysterious staring contest","title":"What? <em>Whattt?</em>","intro":"Picture this: someone is quietly doing their own thing. Someone else is staring. Not saying a word. Just staring with the confidence of a person who knows exactly what they're doing.","question":"What happens when they finally ask, 'What?'","options":[["Nothinggg. 😇","A suspiciously innocent answer. The jury is unconvinced."],["I just like looking at you.","Oh. Well. That's unfairly sweet. I had a joke ready and everything."]],"after":"It's the tiny imagined moments that get me. The ones that sound silly until you realise how lovely they would be."},{"tag":"The no-instruction-manual problem","title":"Someone should invent <em>this.</em>","intro":"Technology can do a thousand impressive things, yet somehow nobody has figured out how to send a proper hug through a screen. A spectacular failure of innovation.","question":"Which invention are we funding first?","options":[["A hug-delivery button.","Press once for a hug. Hold for the deluxe, won't-let-go version."],["A five-minute teleport.","Five minutes? Preet, you would spend four of them arguing about when to leave."]],"after":"Until the inventors get their act together, we make do with words, laughter, and those little messages that arrive at exactly the right time."},{"tag":"A letter without a clever disguise","title":"Something I <em>mean.</em>","intro":"Okay. One moment without the jokes. I wrote you a letter. I promise I haven't hidden a pop quiz inside it.","question":"How shall we open it?","options":[["Gently. It's a letter.","Very graceful. I shall pretend I sealed it with wax and impeccable handwriting."],["OPEN IT ALREADY.","The envelope has been defeated in combat. Your prize: feelings."]],"letter":true,"after":"Dear Preet,\\n\\nThere are people who arrive loudly, and people who quietly become part of the rhythm of your days. Somehow, you manage to do both. You make room for laughter even in the most ordinary conversations, and you make the ordinary ones worth remembering.\\n\\nI want to say this clearly, without hiding behind a joke: I care about you. I miss you. Sometimes something small happens and my first thought is that I wish I could tell you. Sometimes a conversation ends and I wish we had a little more time.\\n\\nI admire the way you feel things deeply and still find room to be playful. I admire the tenderness underneath your mischief. And I hope you never feel you have to be any less yourself to be understood.\\n\\nFor your birthday, I wish you more than one perfect day. I wish you days where you feel heard, mornings that are kind to you, people who show up, and a life that keeps making space for the things that matter to your heart.\\n\\nYou deserve affection that doesn't need decoding, laughter that comes easily, and a thousand small reasons to feel happy.\\n\\nHappy birthday, Preet. I'm really glad you're here."},{"tag":"Exhibit A: a moment","title":"Proof that ordinary <em>isn't ordinary.</em>","intro":"Not every good memory arrives with dramatic lighting and a soundtrack. Some just happen while nobody is paying attention.","question":"What shall we call this one?","options":[["A little time capsule.","Filed under: things worth remembering when the day needs rescuing."],["Evidence of our nonsense.","Your honour, the photograph speaks for itself. We have no further questions."]],"photo":true,"after":"It's funny how a moment can be small while you're living it, and lovely when you look back."},{"tag":"An extremely scientific study","title":"Your smile is <em>suspicious.</em>","intro":"Researchers have been unable to explain how one person's smile can rearrange the mood of an entire day. The researchers are me. The funding is zero.","question":"How do you respond to these findings?","options":[["Sounds scientifically accurate.","Peer reviewed by a very biased committee of one. Still counts."],["Stop being dramatic 😂","I would, but my drama subscription renewed automatically."]],"after":"I hope the coming year gives you so many reasons to smile that even your cheeks start filing complaints."},{"tag":"The extremely normal conversation","title":"Tell me <em>everything.</em>","intro":"Not the polished, highlight-reel version of a day. The little bits. The weird thought. The thing that made you laugh. The tiny inconvenience that deserved a full dramatic retelling.","question":"What's the first thing you tell me?","options":[["The most random thought ever.","Perfect. I have cleared my schedule for this very important nonsense."],["A tiny thing that happened today.","Tell me. I want the small stories too. Especially the small stories."]],"after":"Somehow, hearing about someone's ordinary day can become one of the best parts of your own."},{"tag":"A complaint from the time zones","title":"Different skies, <em>same moon.</em>","intro":"One person is yawning. The other is wide awake. The clocks are behaving like they have a personal grudge. And still, a message finds its way across.","question":"If the clocks gave us one extra hour, what would you do?","options":[["Talk until we forget the time.","The clocks are furious. For once, I think we should ignore them."],["Just stay there, quietly.","No performance. No clever lines. Just the lovely feeling of not having to rush."]],"after":"Distance makes some things complicated. It also makes the simplest moments feel unexpectedly precious."},{"tag":"A tiny act of rebellion","title":"A little <em>less armour.</em>","intro":"You once made a beautiful point without even trying: closeness isn't about finding perfect words. Sometimes it's just choosing not to disappear when the conversation gets difficult.","question":"What should matter more on the messy days?","options":[["Being heard, even when I'm upset.","Yes. Not every feeling needs fixing. Sometimes it needs someone willing to stay and listen."],["A little reassurance, please.","You shouldn't have to solve a puzzle to know you matter. You do. Clearly, plainly, and on the messy days too."]],"after":"I hope your birthday is full of light. And I hope you always find tenderness on the days that aren't."},{"tag":"An unofficial smile audit","title":"Did you just <em>smile?</em>","intro":"Somewhere in the middle of this absurdly long website, there is a very real possibility that you have smiled at your screen. The authorities are investigating.","question":"Would you care to comment?","options":[["No comment. 😌","Noted. The corners of your mouth have submitted a conflicting statement."],["Maybe I did, idiot.","Wonderful. That's one successful long-distance hug, delivered entirely through nonsense."]],"after":"If a few words can make your day a little softer, then every ridiculous line here has done its job."},{"tag":"Department of unnecessary arguments","title":"A little <em>troublemaker.</em>","intro":"Some conversations are peaceful. Others begin with 'Excuse me?' and end with two people laughing at something neither of them can explain.","question":"You've started a tiny argument. What's your opening statement?","options":[["I'm right. Next question.","Powerful argument. No evidence. Remarkable confidence. The judge is impressed."],["First, bring snacks.","A skilled negotiator. The peace treaty now smells delicious."]],"after":"I hope you always keep that wonderfully mischievous spark. The world has enough people pretending to be terribly serious."},{"tag":"An urgent snack-related dilemma","title":"A delicious <em>crisis.</em>","intro":"You are standing before two excellent possibilities. A dramatic soundtrack begins. Somewhere, a food critic faints.","question":"What's your first move?","options":[["🥟 The crispy one.","A crunchy decision. The entire jury nods with its mouth full."],["🍯 The sweet one.","A golden, spiralling victory. Elegance has never been stickier."]],"after":"Naturally, you get both. This is your birthday. I refuse to run a cruel establishment."},{"tag":"The ministry of absolutely nothing","title":"Five more <em>minutes.</em>","intro":"There are conversations where you solve the world's problems. And conversations where you discuss complete nonsense and somehow feel better afterward.","question":"If we had five extra minutes, what would you pick?","options":[["Tell me something real.","Then here's something real: I like hearing about your day, even the bits you think are too small to mention."],["Let's be idiots.","Excellent. I have been training for this role my entire life."]],"after":"I like that we don't always need a grand topic. Sometimes the best part is simply getting to talk."},{"tag":"A note for the less sparkly days","title":"You can put the <em>armour down.</em>","intro":"Even people who make everyone laugh have days when the world feels heavy. This page is for those days, too.","question":"What would feel nicest to hear today?","options":[["You don't have to be okay all the time.","You really don't. You can be tired, uncertain, or quiet. You deserve patience on those days too."],["You don't have to explain everything.","You are allowed to feel things before you find words for them. And you deserve someone willing to listen."]],"after":"May you always have places where you can be completely yourself: loud, soft, silly, serious, and everything in between."},{"tag":"An extremely legitimate birthday ritual","title":"Make a <em>wish.</em>","intro":"The imaginary cake has arrived. It is magnificent. It has zero calories and absolutely no structural integrity. Please approach with dignity. 🎂","question":"How are you making your wish?","options":[["Eyes closed. Very serious.","A hush falls over the room. Even the imaginary cake is being respectful."],["I want unlimited wishes.","A classic loophole. The Birthday Committee is furious but powerless."]],"confetti":true,"after":"I hope a wish you haven't told anyone about finds its way to you. And I hope life surprises you with a few lovely things you never thought to wish for."},{"tag":"The final page, allegedly","title":"For the girl <em>reading this.</em>","intro":"There it is. An entire tiny adventure when three words might have done. I did warn you I wasn't good at keeping things simple.","question":"Before you go, what's the verdict?","options":[["I smiled. Happy now?","Ridiculously. I'd do this all over again for that one smile."],["You're such an idiot 😂","Guilty as charged. But an idiot who means every kind word on this page."]],"after":"Happy birthday, Preet. I hope you feel celebrated today, and cared for on the ordinary days too. You don't have to guess whether you matter to me. You do. Very much. And yes, I am aware that this is an absurdly elaborate way of saying it."}];
let index=0,chosen=-1;const stage=document.getElementById('stage'),count=document.getElementById('count'),bar=document.getElementById('bar');
function escapeText(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const step=steps[index];chosen=-1;count.textContent=String(index+1).padStart(2,'0')+' / '+String(steps.length).padStart(2,'0');bar.style.width=(index/steps.length*100)+'%';stage.className='stage';stage.innerHTML='<div class="eyebrow">'+step.tag+'</div><h1>'+step.title+'</h1><p class="intro">'+step.intro+'</p><p class="prompt">'+step.question+'</p><div class="choices">'+step.options.map((o,i)=>'<button class="choice" data-choice="'+i+'"><span>OPTION 0'+(i+1)+'</span><strong>'+o[0]+'</strong></button>').join('')+'</div><div id="reaction" class="reaction" hidden></div>';stage.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>choose(Number(btn.dataset.choice))));}
function choose(i){if(chosen!==-1)return;chosen=i;const step=steps[index];stage.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});const reaction=document.getElementById('reaction');reaction.hidden=false;let extra='';
if(step.letter){extra='<article class="letter-paper"><h2>Dear Preet,</h2>'+step.after.split('\n\n').map(p=>'<p>'+escapeText(p)+'</p>').join('')+'<p><em>With warmth, always.</em></p></article>'}
else if(step.photo){extra='<figure class="visual"><img src="assets/preview.png" alt="A shared memory" loading="lazy"><figcaption class="caption">One of those moments worth keeping.</figcaption></figure><p>'+escapeText(step.after)+'</p>'}
else{extra='<p>'+escapeText(step.after)+'</p>'}
reaction.innerHTML='<b>'+escapeText(step.options[i][1])+'</b>'+extra+'<button class="next" id="next">'+(index===steps.length-1?'Play again, Preet ↺':'See what’s next →')+'</button>';
document.getElementById('next').addEventListener('click',()=>{index=index===steps.length-1?0:index+1;render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
if(step.confetti)celebrate('confetti',36);else if([0,1,5,10,16,21].includes(index))celebrate('sparkles',18);else if([3,9,18].includes(index))celebrate('hearts',12);
bar.style.width=((index+1)/steps.length*100)+'%';
}

// Soft, original ambient music generated in the browser: no external music file or licensing dependency.
let audioCtx=null,master=null,musicTimer=null,musicEnabled=true,noteIndex=0;
const musicButton=document.getElementById('musicToggle');
const progression=[[261.63,329.63,392],[220,261.63,329.63],[174.61,261.63,349.23],[196,293.66,392]];
function playChord(){
 if(!audioCtx||audioCtx.state!=='running'||!musicEnabled)return;
 const now=audioCtx.currentTime,notes=progression[noteIndex++%progression.length];
 notes.forEach((freq,j)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq/2;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.045/(j+1),now+.75);gain.gain.exponentialRampToValueAtTime(.0001,now+4.9);osc.connect(gain);gain.connect(master);osc.start(now);osc.stop(now+5);});
}
async function startMusic(){
 if(!musicEnabled)return;
 try{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.22;master.connect(audioCtx.destination);}
 await audioCtx.resume();if(!musicTimer){playChord();musicTimer=setInterval(playChord,4400);}
 musicButton.textContent='♫ Music: on';musicButton.setAttribute('aria-pressed','true');
 }catch(e){musicButton.textContent='♫ Tap for music';}
}
musicButton.addEventListener('click',()=>{if(musicEnabled&&audioCtx&&audioCtx.state==='running'){musicEnabled=false;audioCtx.suspend();clearInterval(musicTimer);musicTimer=null;musicButton.textContent='♫ Music: off';musicButton.setAttribute('aria-pressed','false')}else{musicEnabled=true;startMusic()}});
document.addEventListener('pointerdown',()=>{if(musicEnabled)startMusic()},{once:true});
document.addEventListener('keydown',()=>{if(musicEnabled)startMusic()},{once:true});
startMusic(); // Browsers may block sound until her first tap; it then starts automatically.
function celebrate(kind,n){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 for(let i=0;i<n;i++){const el=document.createElement('span');el.className='spark'+(kind==='hearts'?' heart float':'');el.textContent=kind==='hearts'?'♡':kind==='confetti'?['✦','·','✧','✳'][i%4]:['✧','✦','⋆'][i%3];
 el.style.left=(4+Math.random()*92)+'vw';el.style.top=kind==='hearts'?(75+Math.random()*18)+'vh':'-30px';el.style.animationDelay=(Math.random()*1.2)+'s';el.style.fontSize=(13+Math.random()*16)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),5200);}
}
render();
</script></body></html>
